<rect x="310" y="110" width="200" height="55" rx="6" fill="#e5efe9" stroke="#24574c"/>
<text x="410" y="142" class="label" text-anchor="middle">MariaDB transaction</text>
<path d="M410,165 L410,1060" stroke="#7b938b" stroke-dasharray="6 5"/>
<rect x="590" y="110" width="200" height="55" rx="6" fill="#e5efe9" stroke="#24574c"/>
<text x="690" y="142" class="label" text-anchor="middle">Simulated receiver</text>
<path d="M690,165 L690,1060" stroke="#7b938b" stroke-dasharray="6 5"/>
<rect x="870" y="110" width="200" height="55" rx="6" fill="#e5efe9" stroke="#24574c"/>
<text x="970" y="142" class="label" text-anchor="middle">Coordinator</text>
<path d="M970,165 L970,1060" stroke="#7b938b" stroke-dasharray="6 5"/>
<path class="line" d="M130,240 L410,240"/>
<text x="270" y="194" class="small" text-anchor="middle">Insert unique due event key</text>
<path class="line" d="M130,350 L410,350"/>
<text x="270" y="304" class="small" text-anchor="middle">Lock due pending row</text>
<path class="line" d="M130,460 L690,460"/>
<text x="410" y="414" class="small" text-anchor="middle">Attempt delivery with event ID</text>
<path class="line" d="M690,570 L410,570"/>
<text x="550" y="524" class="small" text-anchor="middle">Success insert unique receipt</text>
<path class="line" d="M130,680 L410,680"/>
<text x="270" y="634" class="small" text-anchor="middle">Commit receipt state and audit</text>
<text x="270" y="654" class="small" text-anchor="middle">together</text>
<path class="line" d="M690,790 L130,790"/>
<text x="410" y="744" class="small" text-anchor="middle">Alternative failure outcome transient or permanent</text>
<path class="line" d="M130,900 L410,900"/>
<text x="270" y="854" class="small" text-anchor="middle">Retain retry with backoff or manual</text>
<text x="270" y="874" class="small" text-anchor="middle">review</text>
<path class="line" d="M970,1010 L410,1010"/>
<text x="690" y="964" class="small" text-anchor="middle">Record human handling without resend</text>
