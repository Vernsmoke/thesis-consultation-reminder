<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100">
<rect width="100%" height="100%" fill="#fafaf6"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#24574c"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#173b33}.title{font-size:26px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}.line{fill:none;stroke:#24574c;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="40" y="45" class="title" text-anchor="start">Durable delivery and safe failure sequence</text>
<text x="40" y="76" class="small" text-anchor="start">Architecture export from editable canonical source - not execution evidence</text>
<rect x="30" y="110" width="200" height="55" rx="6" fill="#e5efe9" stroke="#24574c"/>
<text x="130" y="142" class="label" text-anchor="middle">Minute scanner</text>
